apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app: homepage
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="robots" content="noindex, nofollow">
        <title>{{ .Values.page.title | html }}</title>
        <link rel="stylesheet" href="/styles.css">
      </head>
      <body>
        <main>
          <header>
            <h1>{{ .Values.page.title | html }}</h1>
            <p class="lede">{{ .Values.page.description | html }}</p>
          </header>
    {{ range .Values.groups }}
          <section>
            <h2>{{ .name | html }}</h2>
            <div class="links">
    {{ range .links }}
              <a class="link" href="{{ .url | html }}" target="_blank" rel="noreferrer">
                <span class="name">{{ .name | html }}</span>
                <span class="description">{{ .description | html }}</span>
                <span class="arrow" aria-hidden="true">↗</span>
              </a>
    {{ end }}
            </div>
          </section>
    {{ end }}
        </main>
      </body>
    </html>
  styles.css: |
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #09090b;
      color: #f4f4f5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 0%, rgba(59, 130, 246, 0.15), transparent 34rem),
        #09090b;
    }

    main {
      width: min(72rem, calc(100% - 2rem));
      margin: 0 auto;
      padding: 5rem 0;
    }

    header { margin-bottom: 3.5rem; }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 7vw, 5rem);
      line-height: 0.95;
      letter-spacing: -0.055em;
    }

    .lede {
      margin: 1.25rem 0 0;
      color: #a1a1aa;
      font-size: 1.05rem;
    }

    section { margin-top: 2.5rem; }

    h2 {
      margin: 0 0 0.75rem;
      color: #a1a1aa;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
      gap: 0.75rem;
    }

    .link {
      position: relative;
      display: flex;
      min-height: 7rem;
      flex-direction: column;
      justify-content: flex-end;
      padding: 1rem;
      overflow: hidden;
      border: 1px solid #27272a;
      border-radius: 0.85rem;
      background: rgba(24, 24, 27, 0.72);
      color: inherit;
      text-decoration: none;
      transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
    }

    .link:hover,
    .link:focus-visible {
      border-color: #3b82f6;
      background: #18181b;
      transform: translateY(-2px);
      outline: none;
    }

    .name { font-weight: 650; }

    .description {
      margin-top: 0.3rem;
      color: #a1a1aa;
      font-size: 0.85rem;
    }

    .arrow {
      position: absolute;
      top: 0.9rem;
      right: 1rem;
      color: #52525b;
      font-size: 1.1rem;
    }

    .link:hover .arrow,
    .link:focus-visible .arrow { color: #60a5fa; }

    @media (max-width: 40rem) {
      main { padding: 3rem 0; }
      header { margin-bottom: 2.5rem; }
      .links { grid-template-columns: 1fr; }
      .link { min-height: 6rem; }
    }
