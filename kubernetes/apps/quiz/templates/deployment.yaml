apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz
  namespace: quiz
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: quiz
  template:
    metadata:
      labels:
        app: quiz
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: quiz
          image: "{{ .Values.quiz.image.name }}:{{ .Values.quiz.image.tag }}" # defaults in values.yaml, digests pinned by image-updater
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DATABASE_PATH
              value: /data/quiz.sqlite
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: quiz-data
        - name: tmp
          emptyDir: {}
