# Prefilled kubeconfig for hermes: its terminal sandbox rebuilds the shell env from a
# cached snapshot and strips secret-looking vars, so the kubelet-injected KUBERNETES_SERVICE_*
# never reach its shells and kubectl's in-cluster autodetection can't fire
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-kubeconfig
  namespace: hermes-agent
data:
  config: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: in-cluster
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: hermes-agent
        user:
          # kubectl re-reads the file per request, so kubelet token rotation keeps working
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: in-cluster
        context:
          cluster: in-cluster
          user: hermes-agent
    current-context: in-cluster
