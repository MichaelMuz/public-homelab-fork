# ServerSideApply adds defaulted fields (group, kind, weight, matches) to the
# live resource. Without them here, ArgoCD sees a perpetual diff. Keep verbose.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg-private
      namespace: envoy-gateway-system
      sectionName: https-admin
  hostnames:
    - "hubble.admin.michaelmuzafarov.dev"
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: hubble-ui
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
