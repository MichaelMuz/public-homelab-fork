apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: searxng
data:
  settings.yml: |
    use_default_settings:
      engines:
        keep_only:
          - google cse
          - startpage

    general:
      debug: false
      enable_metrics: true

    search:
      safe_search: 0
      default_lang: en-US
      ban_time_on_fail: 5
      max_ban_time_on_fail: 120
      suspended_times:
        SearxEngineAccessDenied: 180
        SearxEngineCaptcha: 3600
        SearxEngineTooManyRequests: 180
        cf_SearxEngineCaptcha: 1296000
        cf_SearxEngineAccessDenied: 86400
        recaptcha_SearxEngineCaptcha: 604800
      formats:
        - html
        - json

    server:
      limiter: false
      method: GET

    outgoing:
      request_timeout: 8.0
      max_request_timeout: 12.0
      pool_connections: 20
      pool_maxsize: 5

    engines:
      - name: google cse
        disabled: false
      - name: startpage
        disabled: false
